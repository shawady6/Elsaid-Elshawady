name: Build APK

on:
  push:
    branches: [main, android-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy web files to www
        run: |
          rm -rf www && mkdir www
          cp -r index.html manifest.json sw.js icons images www/

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Version and launcher icon
        run: |
          sudo apt-get install -y --no-install-recommends imagemagick
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            convert icons/icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease
            echo "$KEYSTORE_BASE64" | base64 -d > ../release.jks
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/apksigner sign --ks ../release.jks \
              --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out ../elsaid-elshawady.apk app/build/outputs/apk/release/app-release-unsigned.apk
          else
            echo "::warning::No keystore secrets found - building a DEBUG apk (can't update over a release one)"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../elsaid-elshawady.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: elsaid-elshawady-apk
          path: elsaid-elshawady.apk
